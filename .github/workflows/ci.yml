name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; rustup honours it.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # solc is needed only by the artifact-drift check in
      # crates/execution/tests. That test skips when solc is absent, so this
      # step is what keeps the checked-in ERC-20 bytecode honest.
      - name: Install solc
        run: |
          curl -sSL -o "$RUNNER_TEMP/solc" \
            https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux
          chmod +x "$RUNNER_TEMP/solc"
          echo "CHAINNAME_SOLC=$RUNNER_TEMP/solc" >> "$GITHUB_ENV"


      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The M1 gate: the node must boot, initialise storage, and exit cleanly.
      - name: Node boots
        run: |
          cargo run --bin chainname-node -- --check --data-dir "$RUNNER_TEMP/chainname-data"

  fuzz:
    name: fuzz targets build and run briefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz needs nightly and a sanitizer.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A short run on every commit catches a target that stopped building or
      # started crashing immediately. Long campaigns belong on a schedule, not
      # in a pull request.
      - name: Fuzz
        run: |
          for target in message_decode header_rlp compact_target \
                        transaction_decode ghostdag_build; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=4096
            echo "::endgroup::"
          done
