[workspace]
resolver = "3"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coco11211/ai-pothole-detector"

[workspace.dependencies]
# --- internal ---
chainname-primitives = { path = "crates/primitives" }
chainname-pow        = { path = "crates/pow" }
chainname-difficulty = { path = "crates/difficulty" }
chainname-ghostdag   = { path = "crates/ghostdag" }
chainname-storage    = { path = "crates/storage" }
chainname-execution  = { path = "crates/execution" }
chainname-consensus  = { path = "crates/consensus" }
chainname-chain      = { path = "crates/chain" }
chainname-net        = { path = "crates/net" }
chainname-pool       = { path = "crates/pool" }
chainname-rpc        = { path = "crates/rpc" }
chainname-testkit    = { path = "crates/testkit" }
chainname-node       = { path = "crates/node" }


# --- alloy / revm (versions matched to reth v2.6.0's workspace pins) ---
alloy-primitives  = { version = "1.6.1", default-features = false, features = ["map-foldhash", "std"] }
alloy-consensus   = { version = "2.4.2", default-features = false, features = ["std"] }
alloy-eips        = { version = "2.4.2", default-features = false, features = ["std"] }
alloy-genesis     = { version = "2.4.2", default-features = false, features = ["std"] }
alloy-rlp         = { version = "0.3.16", default-features = false, features = ["std"] }
alloy-trie        = { version = "0.9.4", default-features = false, features = ["std"] }
alloy-rpc-types-eth = { version = "2.4.2", default-features = false, features = ["std", "serde"] }
alloy-evm         = { version = "0.39.0", default-features = false, features = ["std"] }
alloy-sol-types   = { version = "1.6.1", default-features = false, features = ["std"] }
alloy-signer      = { version = "2.4.2", default-features = false }
alloy-signer-local = { version = "2.4.2", default-features = false }
alloy-network     = { version = "2.4.2", default-features = false }
revm              = { version = "43.0.2", default-features = false, features = ["std"] }

# --- utility ---
thiserror  = "2"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
clap       = { version = "4", features = ["derive", "env"] }
eyre       = "0.6"
parking_lot = "0.12"
rand       = "0.9"
tiny-keccak = { version = "2", features = ["keccak"] }
proptest   = "1"
jsonrpsee  = { version = "0.26", features = ["server", "client", "macros"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
redb       = "2"
tempfile   = "3"
hex        = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Consensus code must be integer-only. See DECISIONS.md D-009.
float_arithmetic = "deny"
cast_possible_truncation = "warn"
